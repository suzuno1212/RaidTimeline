name: test

on:
  push:
    branches: [main]
    paths: ['converter/**', 'addon/**', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: converter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: addon simulation (route)
        run: python tools/addon_sim/run_route.py
